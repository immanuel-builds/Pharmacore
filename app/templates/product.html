{% extends "base.html" %}

{% block title %}{{ product_name }}{% endblock %}

{% block content %}
<div id="product-view" style="padding: 60px 0; display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 60px;">
    <div id="product-info">
        <div id="product-hero-loading" class="state-loading">Analyzing molecular structure...</div>
        <div id="product-hero" style="display: none;">
            <h1 id="p-name" class="serif" style="font-size: 4rem; margin-bottom: 20px;"></h1>
            <p id="p-generic" style="color: var(--accent); text-transform: uppercase; letter-spacing: 2px; font-weight: 600; margin-bottom: 40px;"></p>

            <div id="p-image" style="width: 100%; height: 400px; background: var(--surface); border-radius: 20px; margin-bottom: 40px; overflow: hidden;">
                <img src="" style="width: 100%; height: 100%; object-fit: cover;">
            </div>

            <div class="card" style="margin-bottom: 40px;">
                <h2 class="serif" style="margin-bottom: 20px;">Pharmacore Insight</h2>
                <div id="p-safety" style="display: grid; grid-template-columns: 1fr 1fr; gap: 30px;">
                    <!-- Populated by JS -->
                </div>
            </div>

            <div id="p-description" style="line-height: 1.8; color: var(--text-dim);"></div>
        </div>
    </div>

    <aside>
        <div class="card" style="position: sticky; top: 120px;">
            <div id="p-price" style="font-size: 2.5rem; font-family: var(--font-serif); margin-bottom: 10px;"></div>
            <div id="p-delivery" style="margin-bottom: 30px; font-size: 0.9rem;"></div>

            <button id="add-to-cart-btn" class="btn btn-primary" style="width: 100%; padding: 20px;">Initialize Acquisition</button>
            <p style="text-align: center; font-size: 0.7rem; color: var(--text-dim); margin-top: 15px; text-transform: uppercase; letter-spacing: 1px;">
                Laboratory Verified Synthesis
            </p>
        </div>
    </aside>
</div>

<script type="module">
    import { api, animatePageIn } from "{{ url_for('static', filename='js/app.js') }}";

    const productId = {{ product_id }};
    const userLocation = { lat: 12.9710, lng: 77.5940 }; // Mocked for demo

    async function loadProduct() {
        const res = await api.post(`/experience/product-view/${productId}`, { user_location: userLocation });
        if (res.status === 'success') {
            const d = res.data;
            document.getElementById('product-hero-loading').style.display = 'none';
            document.getElementById('product-hero').style.display = 'block';

            document.getElementById('p-name').textContent = d.product.name;
            document.getElementById('p-generic').textContent = d.product.generic_name;
            document.querySelector('#p-image img').src = d.product.image_url;
            document.getElementById('p-price').textContent = `$${d.product.price.toFixed(2)}`;
            document.getElementById('p-description').textContent = d.product.description;

            if (d.safety) {
                document.getElementById('p-safety').innerHTML = `
                    <div>
                        <span style="font-size: 0.7rem; text-transform: uppercase; color: var(--text-dim);">Risk Level</span>
                        <p style="font-weight: 600;">${d.safety.risk_level}</p>
                    </div>
                    <div>
                        <span style="font-size: 0.7rem; text-transform: uppercase; color: var(--text-dim);">Confidence</span>
                        <p style="font-weight: 600;">${(d.safety.confidence * 100).toFixed(1)}%</p>
                    </div>
                    <div style="grid-column: span 2;">
                        <span style="font-size: 0.7rem; text-transform: uppercase; color: var(--text-dim);">Mechanism</span>
                        <p style="font-size: 0.9rem; margin-top: 5px;">${d.safety.mechanism}</p>
                    </div>
                `;
            }

            if (d.delivery) {
                document.getElementById('p-delivery').innerHTML = d.delivery.available ?
                    `<span style="color: var(--success);">● Available</span> in ${d.delivery.store} (${d.delivery.eta})` :
                    `<span style="color: var(--error);">● ${d.delivery.error}</span>`;
            }

            animatePageIn('#product-hero');
        }
    }

    document.getElementById('add-to-cart-btn').addEventListener('click', async () => {
        const res = await api.post('/commerce/cart/add', { product_id: productId, quantity: 1 });
        if (res.status === 'success') {
            alert('Added to cart');
        } else {
            window.location.href = '/login';
        }
    });

    loadProduct();
</script>
{% endblock %}
