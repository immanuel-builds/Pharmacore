{% extends "base.html" %}

{% block title %}Secure Access{% endblock %}

{% block content %}
<div id="login-page" style="height: 80vh; display: flex; align-items: center; justify-content: center;">
    <div class="card" style="width: 100%; max-width: 400px; padding: 40px;">
        <h2 class="serif" style="font-size: 2rem; margin-bottom: 10px;">Secure Access</h2>
        <p style="color: var(--text-dim); font-size: 0.9rem; margin-bottom: 30px;">Enter your institutional credentials.</p>

        <form id="login-form">
            <div style="margin-bottom: 20px;">
                <label style="display: block; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px;">Institutional Email</label>
                <input type="email" id="email" required placeholder="dr.thorne@pharmacore.int">
            </div>
            <div style="margin-bottom: 30px;">
                <label style="display: block; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px;">Cryptographic Key</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">Authorize Access</button>
        </form>
    </div>
</div>

<script type="module">
    import { api, animatePageIn } from "{{ url_for('static', filename='js/app.js') }}";

    document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        const res = await api.post('/auth/login', { email, password });
        if (res.status === 'success') {
            window.location.href = '/';
        } else {
            alert(res.error);
        }
    });

    animatePageIn('#login-page');
</script>
{% endblock %}
