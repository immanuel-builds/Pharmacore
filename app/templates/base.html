<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apothecary | {% block title %}{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
</head>
<body>
    <nav class="navbar container">
        <a href="/" class="logo serif">Apothecary</a>
        <div class="nav-links">
            <a href="/">Catalog</a>
            <a href="/cart">Cart</a>
            <span id="user-nav">
                <a href="/login">Login</a>
            </span>
        </div>
    </nav>

    <main id="app-root" class="container">
        {% block content %}{% endblock %}
    </main>

    <script type="module" src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
